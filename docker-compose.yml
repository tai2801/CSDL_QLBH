version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: smartsales-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartsales_dev_only}
      MYSQL_DATABASE: smartsales
    ports: ["3307:3306"]
    volumes: [smartsales_data:/var/lib/mysql]
    command: --default-authentication-plugin=mysql_native_password
volumes: {smartsales_data: {}}
